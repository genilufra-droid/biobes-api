# BioBes API — Kopje jashtë vendit çdo natë (dhe kur e kërkon ti me dorë).
#
# Kopjet ruhen në një kovë S3-përputhshme (AWS S3, Cloudflare R2, Backblaze
# B2, MinIO). Nëse nuk jepen kredencialet, `backup-offsite.cjs` shkruan në disk
# (i dobishëm vetëm për prova).
#
# Të fshehtat që duhen vendosur te Settings → Secrets and variables → Actions:
#   API_URL, ADMIN_PASS, S3_ENDPOINT, S3_BUCKET, S3_ACCESS_KEY, S3_SECRET_KEY
# Opsionale: S3_REGION (parazgjedhje auto), S3_PREFIX, BACKUP_KEEP_OFFSITE.
name: Kopje jashtë vendit

on:
  schedule:
    - cron: '23 2 * * *'   # çdo natë në 02:23 UTC (04:23 në Shqipëri)
  workflow_dispatch:

jobs:
  kopjo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Varësitë
        working-directory: backend
        run: npm ci || npm install
      - name: Eksport + ngarkim jashtë vendit
        working-directory: backend
        env:
          API_URL: ${{ secrets.API_URL }}
          ADMIN_USER: ${{ secrets.ADMIN_USER || 'admin' }}
          ADMIN_PASS: ${{ secrets.ADMIN_PASS }}
          S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          S3_REGION: ${{ secrets.S3_REGION }}
          S3_ACCESS_KEY: ${{ secrets.S3_ACCESS_KEY }}
          S3_SECRET_KEY: ${{ secrets.S3_SECRET_KEY }}
          S3_PREFIX: biobes
          BACKUP_KEEP_OFFSITE: '30'
        run: node scripts/backup-offsite.cjs
      - name: Njoftim kur dështon
        if: failure()
        env:
          ERROR_WEBHOOK_URL: ${{ secrets.ERROR_WEBHOOK_URL }}
        run: |
          if [ -n "$ERROR_WEBHOOK_URL" ]; then
            curl -s -X POST "$ERROR_WEBHOOK_URL" -H 'Content-Type: application/json' \
              -d '{"text":"Kopja jashtë vendit e BioBes API dështoi sonte — kontrolloje (Actions → Kopje jashtë vendit)."}'
          fi
