name: Phase 1 full cloud tests

on:
  push:
    branches:
      - chatgpt/faza1-cloud-sync
    paths:
      - .github/workflows/phase1-full-tests.yml

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/faza1-cloud-sync
      - name: Install dependencies
        run: npm install
      - name: Syntax
        run: node --check server.js
      - name: Access tests
        run: npm run test:access
      - name: E2E tests
        run: npm run test:e2e
      - name: Two-device concurrency / CAS
        run: npm run test:concurrent
