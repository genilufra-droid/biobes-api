name: Phase 1 wipe epoch polling
on:
  push:
    branches: [chatgpt/faza1-cloud-sync]
    paths:
      - .github/workflows/phase1-wipe-version.yml
      - .github/phase1-wipe-version.py
permissions:
  contents: write
jobs:
  patch-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/faza1-cloud-sync
      - name: Apply wipe polling patch
        working-directory: .
        run: python3 .github/phase1-wipe-version.py
      - name: Install dependencies
        run: npm install
      - name: Syntax
        run: node --check server.js && node --check test-wipe-epoch.js
      - name: Wipe regression
        run: node test-wipe-epoch.js
      - name: CAS regression
        run: npm run test:concurrent
      - name: Commit backend fix
        working-directory: .
        run: |
          git config user.name 'ChatGPT Phase 1'
          git config user.email 'actions@users.noreply.github.com'
          git add backend/server.js
          git commit -m 'fix(cloud): expose wipe epoch in version polling'
          git push origin HEAD:chatgpt/faza1-cloud-sync
