name: Phase 1 apply state version guard

on:
  push:
    branches:
      - chatgpt/faza1-cloud-sync
    paths:
      - .github/workflows/phase1-apply-guard.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/faza1-cloud-sync
          fetch-depth: 0

      - name: Remove blind state writes and require baseVersion
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('backend/server.js')
          text = path.read_text(encoding='utf-8')

          start_marker = "    if (baseVersion === undefined || baseVersion === null) {\n"
          end_marker = "    if (!Number.isFinite(+baseVersion)) {\n"
          start = text.find(start_marker)
          end = text.find(end_marker, start if start >= 0 else 0)
          if start < 0 or end < 0 or end <= start:
              raise SystemExit('Phase1 guard markers not found; refusing to modify server.js')

          replacement = """    // Phase 1 cloud safety: every normal state write is optimistic-concurrency guarded.\n    // A missing baseVersion is never allowed to overwrite the current server state.\n    if (baseVersion === undefined || baseVersion === null) {\n      await audit(req.user.username, 'STATE_PUT_REJECTED', 'missing baseVersion');\n      return res.status(400).json({\n        ok: false,\n        code: 'BASE_VERSION_REQUIRED',\n        error: 'baseVersion është i detyrueshëm — merrni fillimisht /api/state'\n      });\n    }\n"""
          text = text[:start] + replacement + text[end:]
          text = text.replace(
              "    if (!Number.isFinite(+baseVersion)) {\n      return res.status(400).json({ ok: false, error: 'baseVersion i pavlefshëm' });\n    }",
              "    if (!Number.isInteger(Number(baseVersion)) || Number(baseVersion) < 0) {\n      return res.status(400).json({ ok: false, code: 'BASE_VERSION_INVALID', error: 'baseVersion i pavlefshëm' });\n    }",
              1
          )
          if "(blind)" in text or "Blind write (first push / legacy client)" in text:
              raise SystemExit('Blind-write implementation still present; refusing commit')
          path.write_text(text, encoding='utf-8')
          PY

      - name: Syntax check
        run: node --check backend/server.js

      - name: Verify guard contract
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s = Path('backend/server.js').read_text(encoding='utf-8')
          assert "BASE_VERSION_REQUIRED" in s
          assert "Blind write (first push / legacy client)" not in s
          assert "(blind)" not in s
          assert "baseVersion === 0" in s or "+baseVersion === 0" in s
          print('Phase 1 state guard: PASS')
          PY

      - name: Commit patched backend
        run: |
          if git diff --quiet -- backend/server.js; then
            echo 'No changes to commit'
            exit 0
          fi
          git config user.name 'ChatGPT Phase 1'
          git config user.email 'actions@users.noreply.github.com'
          git add backend/server.js
          git commit -m 'fix(sync): require baseVersion and remove blind state writes'
          git push origin HEAD:chatgpt/faza1-cloud-sync
